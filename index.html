<!DOCTYPE html>
<html lang="zh">

<head>
    <script src="https://unpkg.com/vue@2"></script>
    <script src="https://unpkg.com/vue-select@2"></script>
    <script src="https://unpkg.com/vue-router@2"></script>
</head>

<body>
    <div id="app">
        <details>
            <summary>temi Chinese Version</summary>
            <h2> powered by Tencent DingDang</h2>
            <input size="40" v-model="textInput" placeholder="输入语音文字" />
            <button v-on:click="post_text">转换为音频</button>
            <br>
            <p>声音</p>
            <v-select :options="options" v-model="selected"></v-select>
            <p>
            <div>
                <input type="range" id="speed" name="speed" min="0.5" max="2.0" v-model="speed" step="0.5">
                <label for="speed">Speed {{ speed }}</label>
            </div>
            <div>
                <input type="range" id="pitch" name="pitch" min="-10" max="10" v-model="pitch" step="1">
                <label for="pitch">Pitch {{ pitch }}</label>
            </div>
            </p>
            <div v-if="loading">
                <br>
                <div id="loader" class="loader"></div>
            </div>
            <div v-if="!loading">
                <br>
                <audio id="audio" autoplay="true" controls="" v-bind:src="'data:audio/mpeg;base64,' + audioData">
                    The “audio” tag is not supported by your browser.
                </audio>
            </div>
        </details>
    </div>

    <div id="app2">
        <h1>temi TTS powered by Google</h1>
        <input size="40" v-model="textInput" placeholder="Input text" />

        <p>Language</p>
        <v-select :options="languages" label="label" v-model="selectedLanguage"></v-select>
        <p>Voice</p>
        <v-select :options="filteredVoices" label="label" v-model="selected"></v-select>

        </p>
        <div v-if="loading">
            <br>

        </div>
        <div v-if="!loading">
            <br>
            <audio id="audio" autoplay="true" controls="" v-bind:src="'data:audio/mpeg;base64,' + audioData">
                The “audio” tag is not supported by your browser.
            </audio>
        </div>
    </div>

    <div id="app3">

        </div>
        <div>
            <input type="range" id="pitch" name="pitch" min="-20" max="20" v-model="pitch" step="1">
            <label for="pitch">Pitch {{ pitch }}</label>
        </div>
        <label class="switch">
            <input type="checkbox" v-model="female">
            <span class="slider round"></span>
        </label>
        <label v-if="female">Female</label>
        <label v-else>Male</label>
        </p>
        <div v-if="loading">
            <br>
            <div id="loader" class="loader"></div>
        </div>

        </div>

<style>
    .loader {
        border: 5px solid #f3f3f3;
        border-radius: 50%;
        border-top: 5px solid #3498db;
        width: 30px;
        height: 30px;
        -webkit-animation: spin 1s linear infinite;
        /* Safari */
        animation: spin 1s linear infinite;
    }

    #app {
        max-width: 30em;
    }

    #app2 {
        max-width: 30em;
    }

    #app3 {
        max-width: 30em;
    }

    /* Safari */
    @-webkit-keyframes spin {
        0% {
            -webkit-transform: rotate(0deg);
        }

        100% {
            -webkit-transform: rotate(360deg);
        }
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }

    /* The switch - the box around the slider */
    .switch {
        position: relative;
        display: inline-block;
        width: 60px;
        height: 22px;
    }

    /* Hide default HTML checkbox */
    .switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }

    /* The slider */
    .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        -webkit-transition: .4s;
        transition: .4s;
    }

    .slider:before {
        position: absolute;
        content: "";
        height: 14px;
        width: 14px;
        left: 10px;
        bottom: 4px;
        background-color: white;
        -webkit-transition: .4s;
        transition: .4s;
    }

    input:checked+.slider {
        background-color: #0075FF;
    }

    input:focus+.slider {
        box-shadow: 0 0 1px #0075FF;
    }

    input:checked+.slider:before {
        -webkit-transform: translateX(26px);
        -ms-transform: translateX(26px);
        transform: translateX(26px);
    }

    /* Rounded sliders */
    .slider.round {
        border-radius: 34px;
    }

    .slider.round:before {
        border-radius: 50%;
    }
</style>
